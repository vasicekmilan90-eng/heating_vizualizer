<svg role="group" viewBox="0 -50 784 505" aria-label="Heating schema" xmlns="http://www.w3.org/2000/svg" width="784" height="505"><style>svg { --primary-color: #03a9f4; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c; --divider-color: rgba(225, 225, 225, 0.2); font-family: Roboto, "Segoe UI", Arial, sans-serif; font-size: 14px; }
:host { display: block; width: 100%; overflow: auto; }
svg { width: 100%; min-height: 280px; background: var(--ha-card-background, var(--card-background-color, #1c1c1c)); border-radius: var(--ha-card-border-radius, 12px); user-select: none; }
.pipe { fill: none; stroke: rgb(120, 144, 156); stroke-width: 4; stroke-linecap: round; }
.pipe.selected { stroke: var(--primary-color, #03a9f4); stroke-width: 6; }
.pipe-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.grid-dot { fill: var(--divider-color, #555); }
.spinning { transform-box: fill-box; transform-origin: center center; animation: 1.6s linear 0s infinite normal none running spin; }
@keyframes spin { 
  100% { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .spinning { animation: auto ease 0s 1 normal none running none; }
}
.device-label { fill: var(--primary-text-color, #e0e0e0); font-size: var(--ha-font-size-xs, 11px); pointer-events: none; }
.device-value { fill: var(--primary-text-color, #e0e0e0); font-size: var(--ha-font-size-s, 12px); font-weight: var(--ha-font-weight-medium, 500); pointer-events: none; }
.node { cursor: default; }
:host([editable]) .node { cursor: pointer; }
:host([drawing]) .node { cursor: grab; }
:host([drawing]) .node.dragging { cursor: grabbing; }
:host([drawing]) svg { touch-action: none; }
svg:focus-visible { outline: 2px solid var(--primary-color, #03a9f4); outline-offset: 2px; }
.actionable:focus { outline: none; }
.actionable:focus-visible { outline: 2px solid var(--primary-color, #03a9f4); outline-offset: 4px; }
.overlay-group { pointer-events: none; }
:host(:not([editable])) .actionable { cursor: pointer; }
:host(:not([editable])) .overlay-group.actionable { pointer-events: auto; }
.addon-value { font-size: var(--ha-font-size-xs, 11px); }
.heating-rod.active { filter: drop-shadow(rgb(255, 112, 67) 0px 0px 3px); }
.overlay-bg { fill: var(--card-background-color, #1c1c1c); stroke: var(--divider-color, #555); stroke-width: 1; opacity: 0.92; }
.overlay-text { fill: var(--primary-text-color, #e0e0e0); font-size: var(--ha-font-size-s, 12px); }
.port-highlight { stroke: var(--primary-color, #03a9f4) !important; stroke-width: 3 !important; }</style><rect x="0" y="-50" width="784" height="505" rx="12" fill="#1c1c1c"/>
        
        
